name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_reference_cases test_fast_paths
      # The v1/v2 quality table is deterministic: it must regenerate byte for byte.
      # TIMINGS.md (machine-dependent) and the v3 study (about 15 min, MILP with a
      # time limit) are not checked here.
      - run: python qubo_vs_greedy.py
      - run: git diff --exit-code RESULTS.md
